name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Put the bundled LLVM on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # Clang-dependent tests skip themselves when Clang is missing. CI must
      # prove the toolchain is present and new enough, or the one criterion
      # Prototype acceptance checks must not disappear from a green run.
      # This checks the same binary oclc resolves, not merely whatever is on PATH.
      - name: Verify the toolchain
        run: python tools/check_clang_version.py

      - name: Run tests
        env:
          OCL_REQUIRE_CLANG: "1"
        run: python -m unittest discover -s tests -v

      # Preserve earlier contracts and prove the 0.9 enums/match milestone.
      - name: Acceptance tests
        shell: bash
        run: |
          python oclc.py build examples/hello.ocl
          python oclc.py build examples/add.ocl
          python oclc.py build examples/local.ocl
          python oclc.py build examples/decisions.ocl
          python oclc.py build examples/repeat.ocl
          python oclc.py build examples/loop_control.ocl
          python oclc.py build examples/arrays.ocl
          python oclc.py build examples/structures.ocl
          python oclc.py build examples/enums.ocl
          if [ "$RUNNER_OS" = "Windows" ]; then suffix=.exe; else suffix=; fi
          for program in hello add local decisions repeat loop_control arrays structures enums; do
            exe="examples/${program}${suffix}"
            set +e
            "./$exe"
            code=$?
            set -e
            echo "$program exit code: $code"
            test "$code" -eq 42
          done
